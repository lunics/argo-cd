keycloak:
  postgresql:
    enabled: false         # failed to pull and unpack image "docker.io/bitnami/postgresql:17.6.0-debian-12-r0": failed to resolve reference "docker.io/bitnami/postgresql:17.6.0-debian-12-r0": docker.io/bitnami/postgresql:17.6.0-debian-12-r0: not found
    auth:
      database: keycloak
      username: keycloak
      existingSecret: keycloak-secrets
      secretKeys:
        userPasswordKey: password

  externalDatabase:
    host:     keycloak-postgres-rw.keycloak.svc.cluster.local
    port:     5432
    database: keycloak
    user:     keycloak
    existingSecret:            keycloak-secrets
    existingSecretUserKey:     username
    existingSecretPasswordKey: password

  production: false
  hostnameStrict: false
  adminRealm: master
  auth:
    adminUser: user
    # administrator password for the new user
    adminPassword: ""
    # Existing secret containing Keycloak admin password
    existingSecret: keycloak-secret
    # Key where the Keycloak admin password is being stored inside the existing secret
    passwordSecretKey: admin-password
