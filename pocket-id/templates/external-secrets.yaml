apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name:      pocket-id-encryption-key
  namespace: pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-secret-store
  target:
    name: pocket-id-encryption-key
  dataFrom:
    - extract:
        key: pocket-id/pocket-id-encryption-key
